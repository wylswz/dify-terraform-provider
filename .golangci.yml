# Visit https://golangci-lint.run/ for usage documentation
# and information on other useful linters
version: "2"

issues:
  max-same-issues: 0

linters:
  enable:
    - copyloopvar
    - durationcheck
    - errcheck
    - godot
    - govet
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - predeclared
    - staticcheck
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting

formatters:
  enable:
    - gofmt
    - goimports
