app:
  description: Search the web with Tavily and summarize the findings
  icon: 🔎
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: Research
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/tavily:0.1.7@5fce9cf01fecda9ad92e5125397d2bb5497429baed276c7f14f033e7debd0abe
    version: null
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    edges:
    - data:
        sourceType: start
        targetType: tool
      id: start-search
      source: start
      sourceHandle: source
      target: search
      targetHandle: target
      type: custom
    - data:
        sourceType: tool
        targetType: llm
      id: search-llm
      source: search
      sourceHandle: source
      target: llm
      targetHandle: target
      type: custom
    - data:
        sourceType: llm
        targetType: end
      id: llm-end
      source: llm
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
    nodes:
    - data:
        desc: ''
        selected: false
        title: START
        type: start
        variables:
        - label: Query
          max_length: 256
          options: []
          required: true
          type: text-input
          variable: query
      height: 90
      id: start
      position:
        x: 50
        y: 282
      positionAbsolute:
        x: 50
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        desc: ''
        provider_id: langgenius/tavily/tavily
        provider_name: langgenius/tavily/tavily
        provider_type: builtin
        plugin_id: langgenius/tavily
        plugin_unique_identifier: langgenius/tavily:0.1.7@5fce9cf01fecda9ad92e5125397d2bb5497429baed276c7f14f033e7debd0abe
        selected: false
        title: Tavily Search
        tool_configurations:
          max_results:
            type: constant
            value: 5
        tool_label: Tavily Search
        tool_name: tavily_search
        tool_node_version: '2'
        tool_parameters:
          query:
            type: mixed
            value: '{{#start.query#}}'
          search_depth:
            type: constant
            value: basic
          topic:
            type: constant
            value: general
        type: tool
      height: 88
      id: search
      position:
        x: 334
        y: 282
      positionAbsolute:
        x: 334
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: ''
        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: gpt-4o-mini
          provider: langgenius/openai/openai
        prompt_template:
        - id: research-system
          role: system
          text: You are a research assistant. Summarize the search results into a
            concise, factual answer with sources mentioned inline.
        - id: research-user
          role: user
          text: 'Question: {{#start.query#}}

            Search results: {{#search.text#}}'
        selected: false
        title: Summarize
        type: llm
        vision:
          enabled: false
      height: 88
      id: llm
      position:
        x: 618
        y: 282
      positionAbsolute:
        x: 618
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        desc: ''
        outputs:
        - value_selector:
          - llm
          - text
          variable: answer
        selected: false
        title: END
        type: end
      height: 88
      id: end
      position:
        x: 902
        y: 282
      positionAbsolute:
        x: 902
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    viewport:
      x: 0
      y: 0
      zoom: 1
