app:
  description: Acceptance test app
  icon: 🤖
  icon_background: '#E4FBCC'
  icon_type: emoji
  mode: workflow
  name: tfacc
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    edges:
    - data:
        sourceType: start
        targetType: end
      id: start-end
      source: start
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
    nodes:
    - data:
        desc: ''
        selected: false
        title: START
        type: start
        variables:
        - label: Text
          max_length: 4000
          options: []
          required: true
          type: paragraph
          variable: text
      height: 116
      id: start
      position:
        x: 50
        y: 282
      positionAbsolute:
        x: 50
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        desc: ''
        outputs:
        - value_selector:
          - start
          - text
          variable: text
        selected: false
        title: END
        type: end
      height: 88
      id: end
      position:
        x: 334
        y: 282
      positionAbsolute:
        x: 334
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    viewport:
      x: 0
      y: 0
      zoom: 1
