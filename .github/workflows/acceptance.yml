name: Acceptance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      complete:
        description: Also run the examples/complete parity test (needs OPENAI_API_KEY / TAVILY_API_KEY secrets)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  acceptance:
    name: Acceptance tests against pinned Dify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.0
          terraform_wrapper: false
      # Boots upstream langgenius/dify Docker Compose pinned to
      # scripts/dify-commit (images retagged to that SHA in a scratch copy),
      # initializes the console, mints a PAT, and runs `make testacc`.
      - if: ${{ github.event_name != 'workflow_dispatch' || !inputs.complete }}
        run: bash scripts/dify-acceptance.sh

      # Full-parity mode: manual dispatch only, so the external-credential
      # secrets are never read for pull_request runs (which may come from
      # forks where secrets are unavailable anyway).
      - name: Acceptance tests incl. examples/complete parity
        if: github.event_name == 'workflow_dispatch' && inputs.complete
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
        run: bash scripts/dify-acceptance.sh --complete
