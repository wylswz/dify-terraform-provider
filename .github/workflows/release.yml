# Terraform Provider release workflow.
#
# This workflow runs on every `v*` tag push and publishes a release via
# GoReleaser: cross-compiled archives, a SHA256SUMS manifest signed with GPG,
# and the terraform-registry-manifest.json required by the Terraform Registry.
#
# Required repository secrets:
#   GPG_PRIVATE_KEY - ASCII-armored GPG private key used to sign SHA256SUMS
#   PASSPHRASE      - passphrase for the GPG key (omit the var if unencrypted)

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser needs the full history to resolve the tag's commit
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          # GitHub sets this automatically for the release upload
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
